[project]
name = "gpodder-fastapi-router"
version = "0.1.3"
description = "Pluggable FastAPI router that implements the gpodder.net (mygpo) HTTP API."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "zevisvei" }]
keywords = ["gpodder", "mygpo", "fastapi", "podcast", "router"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.20"]
postgresql = ["asyncpg>=0.29"]
all = ["aiosqlite>=0.20", "asyncpg>=0.29"]

[project.scripts]
gpodder-router = "gpodder_router.__main__:main"

[project.urls]
"Homepage" = "https://github.com/zevisvei/gpodder-fastapi-router"
"gpodder.net API" = "https://gpoddernet.readthedocs.io/en/latest/api/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpodder_router"]
artifacts = [
    "src/gpodder_router/dashboard/templates/*.html",
    "src/gpodder_router/dashboard/static/*",
]

[tool.hatch.build.targets.sdist]
include = ["src/gpodder_router", "README.md", "LICENSE", "docs"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
